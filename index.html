         actually requested. -->

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="남하빈 | Product Engineer" />
    <meta property="og:description" content="남하빈의 포트폴리오 — Product Engineer / AX Engineer" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://example.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="남하빈 | Product Engineer" />
    <meta name="twitter:description" content="남하빈의 포트폴리오 — Product Engineer / AX Engineer" />
